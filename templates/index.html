<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Receipt Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 20px; }
        .section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        button { background: #333; color: white; border: none; cursor: pointer; }
        #upload-result, #ask-result { white-space: pre-wrap; background: #f5f5f5; padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Receipt Tracker</h1>

    <div class="section">
        <h2>Upload Struk</h2>
        <form id="upload-form">
            <label>Nama Toko:</label>
            <input type="text" id="merchant" placeholder="misal: McDonald's" required>

            <label>Tanggal Beli:</label>
            <input type="date" id="purchase_date" required>

            <label>Foto Struk:</label>
            <input type="file" id="file" accept="image/*" required>

            <button type="submit">Upload & Ekstrak</button>
        </form>
        <div id="upload-result"></div>
    </div>

    <div class="section">
        <h2>Tanya AI</h2>
        <input type="text" id="question" placeholder="misal: makanan apa yang aku beli kemarin?">
        <button id="ask-btn">Tanya</button>
        <div id="ask-result"></div>
    </div>

    <script>
        document.getElementById("upload-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append("merchant", document.getElementById("merchant").value);
            formData.append("purchase_date", document.getElementById("purchase_date").value);
            formData.append("file", document.getElementById("file").files[0]);

            document.getElementById("upload-result").textContent = "Memproses...";

            const res = await fetch("/upload", { method: "POST", body: formData });
            const data = await res.json();
            document.getElementById("upload-result").textContent = JSON.stringify(data, null, 2);
        });

        document.getElementById("ask-btn").addEventListener("click", async () => {
            const question = document.getElementById("question").value;
            document.getElementById("ask-result").textContent = "Berpikir...";

            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            document.getElementById("ask-result").textContent = data.answer || data.error;
        });
    </script>
</body>
</html>
