name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t receipt-tracker:${{ github.sha }} .

      - name: Smoke test - run container and check homepage
        run: |
          docker run -d -p 5002:5002 -e GEMINI_API_KEY=dummy-key-for-ci --name test-container receipt-tracker:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5002/ || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container
